[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring"
version = "0.1.0"
description = "Credit scoring: scorecard WoE/IV, challenger XGBoost, PSI e política de corte"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.3", "scipy>=1.11",
    "xgboost>=2.0", "matplotlib>=3.8", "joblib>=1.3", "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
